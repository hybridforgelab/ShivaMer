version: "3.9"
services:
  backend:
    build: ./backend
    container_name: shivamer-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8000"
    container_name: shivamer-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend