app = "shivamer-backend"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8000"
PYTHONUNBUFFERED = "1"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[checks.healthz]
type = "http"
interval = "15s"
timeout = "2s"
grace_period = "5s"
method = "GET"
path = "/healthz"

[[vm]]
size = "shared-cpu-1x"
